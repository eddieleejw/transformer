[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transformer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "tqdm",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transformer"]

[project.scripts]
train_decoder = "transformer.train.train_decoder:main"